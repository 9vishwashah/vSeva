[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs credits (twice when both sites build from this repo). Skip the build when a push
  # only touched files the site never uses: docs, the Android project, database scripts, reports, notes.
  # Exit 0 = skip. On a first build (no previous commit) git diff fails, so the build runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)android' ':(exclude)supabase' ':(exclude)SSG' ':(exclude)SSG OUTPUTS' ':(exclude)scratch' ':(exclude)resources' ':(exclude)scripts/*.sql' ':(exclude)*.md'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.12.2"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/directory-sitemap.xml"
  to = "/.netlify/functions/directory-sitemap"
  status = 200
  force = true

# Routes without a file of their own get the plain app page (dist/app.html, see vite.config.ts). The public
# website pages are real files: index.html, documentation.html, contact.html, support-us.html (scripts/prerender.mjs).
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# The HTML entry points are checked on every open so PWA users always pick up a new deploy. "no-cache" (not
# "no-store") lets an unchanged page be answered with a tiny "not modified" instead of the whole page again.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Live updates for the Android app (scripts/app-update-bundle.mjs, services/liveUpdate.ts): the app runs on
# https://localhost, so the manifest needs CORS; it must never be cached, the zips are versioned by name.
[[headers]]
  for = "/app-update/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/app-update/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

# Vite content-hashes every filename under /assets/ — if the content
# changes, so does the URL, so caching forever in the browser is safe and
# never serves stale content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files that are not content-hashed: kept on the device for a week (then re-checked), so repeat views
# cost no request. Website images, fonts and guide PDFs; push notification pictures; icons; share images.
[[headers]]
  for = "/vseva-site/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/notify/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/share/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vseva-icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vseva-icon-180.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/pwa-192x192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/pwa-512x512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vseva-logo-full.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
# Android app-link check (Google fetches it often): a day is plenty
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Baseline security headers for every page (audit 15 Oct 2026). Deliberately conservative: no script/style
# Content-Security-Policy yet (Supabase, OneSignal, MapLibre tiles and Google Fonts would need a tested allow-list).
# frame-ancestors stops other sites embedding the app (clickjacking); geolocation is used by Nearby / SOS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()"
