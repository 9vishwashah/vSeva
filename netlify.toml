[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.12.2"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/directory-sitemap.xml"
  to = "/.netlify/functions/directory-sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure the HTML entry point and service worker files are never cached
# so mobile PWA users always get notified about new deploys.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

# Vite content-hashes every filename under /assets/ — if the content
# changes, so does the URL, so caching forever in the browser is safe and
# never serves stale content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for every page (audit 15 Oct 2026). Deliberately conservative: no script/style
# Content-Security-Policy yet (Supabase, OneSignal, MapLibre tiles and Google Fonts would need a tested allow-list).
# frame-ancestors stops other sites embedding the app (clickjacking); geolocation is used by Nearby / SOS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()"
