<!doctype html>
<!-- Link preview artwork for /leaderboard (1200 x 630) WITHOUT names: the build (scripts/og-leaderboard.mjs) draws the
     current top 3 names and the period on top of it. Render: headless Chrome screenshot at 1200x630, saved as
     scripts/site-sources/og-leaderboard-base.png. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../../public/vseva-site/fonts/BricolageGrotesque.woff2) format('woff2');font-weight:600 900}
@font-face{font-family:G;src:url(../../public/vseva-site/fonts/Geist.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F2EEE7;font-family:G,sans-serif;color:#1D1D1B;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(248,184,120,.55),rgba(248,184,120,0) 68%)}
.left{position:absolute;left:72px;top:46px;width:560px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:76px;height:76px;object-fit:contain}
.brand span{font-family:B;font-weight:800;font-size:40px;letter-spacing:-.03em;color:#E8730C}
h1{margin-top:66px;font-family:B;font-weight:800;font-size:84px;line-height:.9;letter-spacing:-.045em}
h1 em{font-style:normal;color:#E8730C}
.sub{margin-top:20px;font-size:27px;line-height:1.3;color:#57534B}
.url{margin-top:22px;display:inline-flex;align-items:center;background:#1D1D1B;color:#fff;border-radius:999px;padding:15px 26px;font-size:25px;font-weight:600}
.url b{color:#E8730C;font-weight:700}
.podium{position:absolute;right:70px;bottom:0;display:flex;align-items:flex-end;gap:18px}
.tile{width:150px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:24px;position:relative}
.num{font-family:B;font-weight:800;font-size:72px;letter-spacing:-.04em;line-height:1}
.crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%)}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="../../public/vseva-site/logo-mark-192.webp" alt=""><span>vSeva</span></div>
  <h1>Top Vihar<br>Sevaks<br>Globally<em>.</em></h1>
  <p class="sub">Who walked the most? Find yourself.</p>
  <div class="url">vseva.vjas.in<b>/leaderboard</b></div>
</div>
<div class="podium">
  <div class="tile" style="background:#9ED6DF;height:250px"><span class="num">#2</span></div>
  <div class="tile" style="background:#EAC119;height:340px">
    <svg class="crown" width="58" height="42" viewBox="0 0 24 18"><path d="M2 16h20l2-12-6 5-6-8-6 8-6-5z" fill="#E8730C"/></svg>
    <span class="num">#1</span>
  </div>
  <div class="tile" style="background:#EAA7C7;height:200px"><span class="num">#3</span></div>
</div>
</body></html>
