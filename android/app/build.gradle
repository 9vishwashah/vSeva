apply plugin: 'com.android.application'

// Release signing credentials live in keystore.properties (gitignored, local-
// only — see android/.gitignore) alongside the .jks it points at. Neither is
// committed: losing both means losing the ability to publish updates to an
// already-published app, so they're backed up outside git, not protected by
// it. A checkout without this file (e.g. a fresh clone, or CI without the
// secret configured) still builds `release` — it's just unsigned, same as
// before this was wired up — rather than failing the build.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "in.vjas.vseva"
    compileSdk = rootProject.ext.compileSdkVersion
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "in.vjas.vseva"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versioning strategy: versionCode is what Google Play actually tracks —
        // it MUST strictly increase on every single upload (internal testing,
        // closed testing, and production alike; Play rejects a re-used or lower
        // value outright). Bump it by 1 for every AAB you upload, regardless of
        // whether versionName changed. versionName is the human-readable string
        // shown to users (Play Store listing, Settings > Apps) — bump it
        // following normal semver-ish conventions (1.0 -> 1.1 -> 2.0) whenever
        // you want the visible version to change; it can lag behind versionCode
        // incrementing on every build. There is no auto-increment configured —
        // bump both by hand right before each `./gradlew bundleRelease`.
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One project, two apps. `vseva` is the original (in.vjas.vseva, the app already on Google Play) and keeps the
    // defaultConfig above exactly as it was; `ssg` is Shraman Seva Group: its own applicationId, name, icons and
    // version counter (everything brand-specific lives in src/ssg/).
    //   Android Studio:  Build > Select Build Variant > vsevaDebug / ssgDebug, then Run.
    //   Command line:    ./gradlew assembleSsgDebug  |  bundleVsevaRelease  |  bundleSsgRelease
    // Which web build gets bundled is decided by `cap sync` (npm run android:vseva / android:ssg) and is verified at
    // the bottom of this file, so one brand's web app can never be packaged inside the other brand's app.
    flavorDimensions "brand"
    productFlavors {
        vseva {
            dimension "brand"
        }
        ssg {
            dimension "brand"
            applicationId "in.vjas.ssg"
            // Its own Play listing => its own, independent version counter.
            versionCode 1
            versionName "1.0"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// SSG has no Firebase app yet. Until android/app/src/ssg/google-services.json exists (download it from Firebase after
// adding an Android app for in.vjas.ssg), the google-services step is skipped for the ssg variants so they still
// build and run — they just have no Firebase push configuration. vSeva is unaffected.
if (!file('src/ssg/google-services.json').exists()) {
    tasks.matching { it.name ==~ /process(Ssg)\w*GoogleServices/ }.configureEach { enabled = false }
}

// Guard: the web build bundled by `cap sync` must belong to the variant being built. cap sync writes the brand's
// appId into src/main/assets/capacitor.config.json (see capacitor.config.ts); it has to match this variant's
// applicationId, otherwise the build stops with instructions instead of packaging the wrong brand's app.
androidComponents {
    onVariants(selector().all()) { variant ->
        def appId = variant.applicationId
        def capName = variant.name.capitalize()
        def brandName = variant.name.toLowerCase().startsWith('ssg') ? 'ssg' : 'vseva'
        def webConfig = file('src/main/assets/capacitor.config.json')
        def guard = tasks.register("verify${capName}WebAssets") {
            group = 'verification'
            description = "Fails if the synced web build belongs to a different brand than ${variant.name}."
            doLast {
                if (!webConfig.exists()) {
                    throw new GradleException("No web build is bundled yet. Run:  npm run android:${brandName}   (from the project root), then build again.")
                }
                def synced = new groovy.json.JsonSlurper().parseText(webConfig.text).appId
                def expected = appId.get()
                if (synced != expected) {
                    throw new GradleException("The bundled web build is for '${synced}' but this variant is '${expected}'. Run:  npm run android:${brandName}   (from the project root) so the right web build is bundled, then build again.")
                }
            }
        }
        tasks.matching { it.name == "pre${capName}Build" }.configureEach { dependsOn guard }
    }
}
