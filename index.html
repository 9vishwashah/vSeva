<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{HTML_TITLE}}</title>
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  {{CANONICAL_LINK}}

  <!-- Open Graph / Social -->
  <meta property="og:site_name" content="{{NAME}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description"
    content="{{OG_DESCRIPTION}}" />
  {{OG_IMAGE_TAGS}}
  {{OG_URL_TAG}}
  <meta property="og:type" content="website" />
  {{GOOGLE_VERIFICATION}}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description"
    content="{{OG_DESCRIPTION}}" />
  {{TWITTER_IMAGE_TAG}}
  {{REL_ME}}

  <!-- Organization Schema -->
  <script type="application/ld+json">
    {{JSONLD}}
  </script>

  <!-- Icons -->
  <link rel="icon" type="image/png" href="{{ICON}}?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ICON}}?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ICON}}?v=2">
  <link rel="shortcut icon" href="{{ICON}}?v=2">
  <link rel="apple-touch-icon" href="{{ICON}}?v=2">
  <link rel="mask-icon" href="{{ICON}}?v=2" color="{{THEME_COLOR}}">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="{{FONTS_HREF}}"
    rel="stylesheet">
  <!-- Font Awesome removed — replaced with inline SVGs to save ~80KB per load -->
  <!-- Tailwind theme.extend now lives in tailwind.config.js (build-time compiled) -->
  <style>
    /* Minimal entrance-animation shim: the Play CDN loads no plugins, so classes
       like animate-in/fade-in/zoom-in are otherwise inert. Scoped to new redesign
       elements only — pre-existing animate-in usage elsewhere is unaffected. */
    @keyframes app-stagger-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app-stagger-in {
      opacity: 0;
      animation: app-stagger-in 300ms ease-out forwards;
    }

    /* Same reason as app-stagger-in above: animate-in/fade-in/zoom-in are
       inert without the tailwindcss-animate plugin, which the Play CDN never
       loads. Every modal (see components/Modal.tsx) uses these two instead,
       so pop-ups actually transition in rather than appearing instantly. */
    @keyframes app-modal-backdrop-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes app-modal-card-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .app-modal-backdrop {
      animation: app-modal-backdrop-in 180ms ease-out both;
    }
    .app-modal-card {
      animation: app-modal-card-in 200ms ease-out both;
    }
  </style>



</head>

<body style="background:#fff;margin:0">
  <div id="root" style="background:#fff"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
