<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{HTML_TITLE}}</title>
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  {{CANONICAL_LINK}}

  <!-- Open Graph / Social -->
  <meta property="og:site_name" content="{{NAME}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description"
    content="{{OG_DESCRIPTION}}" />
  {{OG_IMAGE_TAGS}}
  {{OG_URL_TAG}}
  <meta property="og:type" content="website" />
  {{GOOGLE_VERIFICATION}}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description"
    content="{{OG_DESCRIPTION}}" />
  {{TWITTER_IMAGE_TAG}}
  {{REL_ME}}

  <!-- Organization Schema -->
  <script type="application/ld+json">
    {{JSONLD}}
  </script>

  <!-- Icons -->
  <link rel="icon" type="image/png" href="{{ICON}}?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ICON}}?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ICON}}?v=2">
  <link rel="shortcut icon" href="{{ICON}}?v=2">
  <link rel="apple-touch-icon" href="{{APPLE_ICON}}?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="mask-icon" href="{{ICON}}?v=2" color="{{THEME_COLOR}}">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="{{FONTS_HREF}}"
    rel="stylesheet">
  <!-- Font Awesome removed — replaced with inline SVGs to save ~80KB per load -->
  <!-- Tailwind theme.extend now lives in tailwind.config.js (build-time compiled) -->
  <style>
    /* Minimal entrance-animation shim: the Play CDN loads no plugins, so classes
       like animate-in/fade-in/zoom-in are otherwise inert. Scoped to new redesign
       elements only — pre-existing animate-in usage elsewhere is unaffected. */
    @keyframes app-stagger-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app-stagger-in {
      opacity: 0;
      animation: app-stagger-in 300ms ease-out forwards;
    }

    /* Same reason as app-stagger-in above: animate-in/fade-in/zoom-in are
       inert without the tailwindcss-animate plugin, which the Play CDN never
       loads. Every modal (see components/Modal.tsx) uses these two instead,
       so pop-ups actually transition in rather than appearing instantly. */
    @keyframes app-modal-backdrop-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes app-modal-card-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    /* 'backwards' (not 'both'): once the entrance finishes the element returns to its normal style, so the
       swipe-to-dismiss gesture (inline transform/opacity) isn't overridden by a lingering animation fill. */
    .app-modal-backdrop {
      animation: app-modal-backdrop-in 180ms ease-out backwards;
    }
    .app-modal-card {
      animation: app-modal-card-in 200ms ease-out backwards;
    }

    /* VChat message area: a warm "wallpaper" (soft sand with a faint dot grid) so the conversation reads as its own
       space, distinct from the white card around it — white bubbles for others, peach for you. */
    .chat-wallpaper {
      background-color: #F4EADD;
      background-image: radial-gradient(circle at 1px 1px, rgba(190, 120, 60, 0.13) 1px, transparent 0);
      background-size: 22px 22px;
    }

    /* Chat bubbles on touch screens: long-press opens our own menu (Reply / Copy / Delete), so suppress the
       system text-selection popup there. Mouse users can still select text normally. */
    @media (pointer: coarse) {
      .chat-bubble { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    }

    /* Bottom sheets glide up; pages slide in from the side you swiped towards (phones only). */
    @keyframes app-sheet-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .app-sheet-up {
      animation: app-sheet-up 300ms cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
    }
    @keyframes app-slide-next {
      from { opacity: 0; transform: translateX(34px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes app-slide-prev {
      from { opacity: 0; transform: translateX(-34px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .app-slide-next { animation: app-slide-next 260ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .app-slide-prev { animation: app-slide-prev 260ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    @media (min-width: 768px), (prefers-reduced-motion: reduce) {
      .app-slide-next, .app-slide-prev, .app-sheet-up { animation: none; }
    }
  </style>



</head>

<body style="background:#fff;margin:0">
  <div id="root" style="background:#fff"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
